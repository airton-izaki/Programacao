<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <title>Cadastro_usuario</title>
  </head>
  <body>

    <nav class = "navbar navbar-dark bg-success">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Cadastro</span>
        </div>
    </nav>
    
    <form action = "{% url 'listagem_usuarios' %}" method = "post">
        {% csrf_token %}
        <div style = "text-align: center;" class="container">

            <h1>Cadastro de Usuários</h1>
            <label for="">Nome</label>
            <input type="text" name = "nome" class = "form-control-sm">

            <label for="">E-mail</label>
            <input type="email" name="email" class = "form-control-sm">          
            <button>Enviar</button>
        </div>
        
    </form>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

  </body>
</html>
